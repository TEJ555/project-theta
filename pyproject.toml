[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-theta"
version = "0.6.0"
description = "A theory-inspired synthetic consciousness indicator research lab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project Theta contributors"}]
keywords = ["consciousness", "ai", "simulation", "reproducibility", "cognitive-architecture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=1.0"]
providers = ["openai>=1.0", "anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
theta = "project_theta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
