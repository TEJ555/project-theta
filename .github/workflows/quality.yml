name: Quality and protocol safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Red-team repaired v4 schedules
        run: python scripts/red_team_v4.py --count 200 --context-seeds 3
